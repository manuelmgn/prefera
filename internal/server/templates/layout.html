{{define "layout"}}
<!DOCTYPE html>
<html lang="pt" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} — {{end}}Prefera</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <!-- Tailwind precompilado (rexenerar con .tools/tailwindcss, ver tailwind.config.js) -->
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
    <script src="/static/vendor/sortable.min.js" defer></script>
    <!-- Apply theme BEFORE rendering (avoids flash) -->
    <script>
    (function(){
        var pref = '{{if .User}}{{.User.ThemePreference}}{{else}}auto{{end}}';
        var dark = false;
        if (pref === 'dark') dark = true;
        else if (pref === 'light') dark = false;
        else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
    })();
    </script>
    <style>
        /* iOS-inspired glassmorphism — light */
        .glass {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
        }
        .glass-nav {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
        }
        .ios-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* Dark variants */
        .dark .glass {
            background: rgba(30,30,40,0.6);
        }
        .dark .glass-nav {
            background: rgba(20,20,30,0.78);
        }
        .dark .ios-card {
            background: rgba(40,40,55,0.6);
            border-color: rgba(255,255,255,0.08);
        }

        .sortable-ghost { opacity: 0.25; }
        .sortable-chosen { box-shadow: 0 12px 40px rgba(0,0,0,0.08); transform: scale(1.02); border-radius: 16px; }
        .dark .sortable-chosen { box-shadow: 0 12px 40px rgba(0,0,0,0.3); }

        /* Mesh gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(139,92,246,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 10%, rgba(99,102,241,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 90%, rgba(236,72,153,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(59,130,246,0.06) 0%, transparent 50%);
        }
        .dark body::before,
        html.dark body::before {
            background:
                radial-gradient(ellipse at 20% 0%, rgba(139,92,246,0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 10%, rgba(99,102,241,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 90%, rgba(236,72,153,0.05) 0%, transparent 50%);
        }

        /* Smooth page transitions */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        main > * { animation: fadeIn 0.4s ease-out; }

        /* Toast notification — mobile: top center; desktop (sm+): top right */
        .app-toast {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translate(-50%, -1rem);
            z-index: 100;
            background: rgba(17, 17, 26, 0.92);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 9999px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .dark .app-toast { background: rgba(255,255,255,0.14); backdrop-filter: blur(20px); }
        .app-toast-visible { opacity: 1; transform: translate(-50%, 0); }
        @media (min-width: 640px) {
            .app-toast { left: auto; right: 1rem; transform: translate(0, -1rem); }
            .app-toast-visible { transform: translate(0, 0); }
        }
    </style>
</head>
<body class="font-sans bg-gray-50/80 dark:bg-[#0e0e14] min-h-screen text-gray-800 dark:text-gray-200 antialiased">
    {{if .User}}
    <!-- Mobile top bar (narrow screens) -->
    <nav class="sm:hidden glass-nav sticky top-0 z-40 border-b border-white/40 dark:border-white/5">
        <div class="flex items-center justify-center px-5 py-3">
            <a href="/" class="flex items-center gap-2 text-[17px] font-bold tracking-tight bg-gradient-to-r from-violet-600 to-indigo-500 bg-clip-text text-transparent">
                <img src="/static/logo.png" alt="" class="w-6 h-6 rounded-lg">
                Prefera
            </a>
        </div>
    </nav>

    <nav class="hidden sm:block glass-nav sticky top-0 z-40 border-b border-white/40 dark:border-white/5">
        <div class="max-w-2xl mx-auto px-5 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-[17px] font-bold tracking-tight bg-gradient-to-r from-violet-600 to-indigo-500 bg-clip-text text-transparent transition-[filter,opacity] duration-300 ease-out hover:drop-shadow-[0_0_16px_rgba(139,92,246,0.28)] hover:opacity-75">
                <img src="/static/logo.png" alt="" class="hidden sm:block w-6 h-6 shrink-0 rounded-lg">
                Prefera
            </a>
            <div class="flex items-center gap-2">
                <a href="/lists/new"
                   class="bg-gradient-to-r from-violet-500 to-indigo-500 text-white px-4 py-[7px] rounded-full text-[13px] font-semibold hover:shadow-lg hover:shadow-violet-500/20 transition-all duration-300 active:scale-[0.97]">
                    + Individual
                </a>
                <a href="/collective/new"
                   class="bg-gradient-to-r from-teal-500 to-cyan-500 text-white px-4 py-[7px] rounded-full text-[13px] font-semibold hover:shadow-lg hover:shadow-teal-500/20 transition-all duration-300 active:scale-[0.97]"
                   title="Criar lista coletiva">
                    + Coletiva
                </a>
                <a href="/my-lists"
                   class="w-8 h-8 rounded-full bg-gray-100/80 dark:bg-white/10 hover:bg-gray-200/80 dark:hover:bg-white/15 flex items-center justify-center transition-colors"
                   title="As minhas listas">
                    <svg class="w-[16px] h-[16px] text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 10h16M4 14h10"/>
                    </svg>
                </a>
                

                <a href="/settings"
                   class="w-8 h-8 rounded-full bg-gray-100/80 dark:bg-white/10 hover:bg-gray-200/80 dark:hover:bg-white/15 flex items-center justify-center transition-colors"
                   title="Ajustes ({{.User.Username}})">
                    <svg class="w-[16px] h-[16px] text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </a>

                {{if .User.IsAdmin}}
                <a href="/admin"
                   class="w-8 h-8 rounded-full bg-amber-100/80 dark:bg-amber-900/30 hover:bg-amber-200/80 dark:hover:bg-amber-800/40 flex items-center justify-center transition-colors"
                   title="Admin">
                    <svg class="w-[16px] h-[16px] text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </a>
                {{end}}

            </div>
        </div>
    </nav>

    <!-- Mobile bottom tab bar (narrow screens) -->
    <nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 glass-nav border-t border-white/40 dark:border-white/5" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="{{if .User.IsAdmin}}grid grid-cols-5{{else}}grid grid-cols-4{{end}}">
            <!-- Início -->
            <a href="/" data-tab="home"
               class="flex flex-col items-center justify-center gap-1 py-2 text-gray-400 dark:text-gray-500">
                <span class="h-6 w-6 flex items-center justify-center">
                    <img src="/static/logo.png" alt="" class="w-6 h-6 rounded-lg">
                </span>
                <span class="text-[10px] font-medium leading-none">Início</span>
            </a>

            <!-- Nova lista -->
            <div class="relative flex items-stretch justify-center" x-data="{ open: false }">
                <button type="button"
                        @click="open = !open"
                        class="flex flex-col items-center justify-center gap-1 py-2 text-gray-400 dark:text-gray-500">
                    <span class="h-6 w-6 flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.5v15m7.5-7.5h-15"/>
                        </svg>
                    </span>
                    <span class="text-[10px] font-medium leading-none">Nova lista</span>
                </button>
                <div x-show="open"
                     x-transition
                     @click.outside="open = false"
                     class="absolute bottom-full mb-3 left-1/2 -translate-x-1/2 w-40 rounded-2xl p-1.5 shadow-xl shadow-gray-200/60 dark:shadow-black/40 glass border border-white/50 dark:border-white/10 z-50"
                     style="display: none;">
                    <a href="/lists/new"
                       class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13px] font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100/80 dark:hover:bg-white/10 transition-colors">
                        <svg class="w-[16px] h-[16px] text-violet-500 dark:text-violet-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
                        </svg>
                        Individual
                    </a>
                    <a href="/collective/new"
                       class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13px] font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100/80 dark:hover:bg-white/10 transition-colors">
                        <svg class="w-[16px] h-[16px] text-teal-500 dark:text-teal-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"/>
                        </svg>
                        Coletiva
                    </a>
                </div>
            </div>

            <!-- Minhas listas -->
            <a href="/my-lists" data-tab="lists"
               class="flex flex-col items-center justify-center gap-1 py-2 text-gray-400 dark:text-gray-500">
                <span class="h-6 w-6 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 10h16M4 14h10"/>
                    </svg>
                </span>
                <span class="text-[10px] font-medium leading-none">Minhas listas</span>
            </a>

            <!-- Ajustes -->
            <a href="/settings" data-tab="profile"
               class="flex flex-col items-center justify-center gap-1 py-2 text-gray-400 dark:text-gray-500">
                <span class="h-6 w-6 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </span>
                <span class="text-[10px] font-medium leading-none">Ajustes</span>
            </a>

            {{if .User.IsAdmin}}
            <!-- Admin -->
            <a href="/admin" data-tab="admin"
               class="flex flex-col items-center justify-center gap-1 py-2 text-gray-400 dark:text-gray-500">
                <span class="h-6 w-6 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </span>
                <span class="text-[10px] font-medium leading-none">Admin</span>
            </a>
            {{end}}
        </div>
    </nav>
    {{end}}

    <main class="max-w-2xl mx-auto px-5 pt-8 pb-28 sm:py-8">
        {{.Content}}
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
